# Application Name
spring.application.name=backend

# Server Configuration
server.port=8080

# Database Configuration (Host default connects to port 3307; Docker will override via env vars)
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3307}/airline_reservation?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis Caching Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT Secret Properties (512-bit secure hex secret key)
app.jwtSecret=9a67471b7961b7f2b1836c888e2c7a1d1297e59b6348ef8977c050731df81a4bfab681944e05b9b8b64b18721c51d6a6234d7d3d191264c921cf81df3e08a688
app.jwtExpirationMs=86400000

# Mail Configuration (Using mock or local smtp container, fallback gracefully if server not available)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Monitoring & Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.health.redis.enabled=false
management.health.mail.enabled=false

# Logging levels
logging.level.com.airline=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
